[package]
name = "sim"
description = "Engine-independent simulation for the low-poly island: terrain, deer, birds."
edition.workspace = true
version.workspace = true
license.workspace = true

# Deliberately tiny: this crate is plain Rust, so it builds and tests natively in
# seconds and knows nothing about rendering.
[dependencies]
# Vector maths (`Vec2`, `Vec3`). It's the same crate Bevy uses internally, so with
# a matching version our vectors *are* Bevy's vectors, with no conversion needed.
glam = "0.33"
