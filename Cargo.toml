# A Cargo *workspace*: one repository, several crates that build together and share
# a single `Cargo.lock` and `target/` directory.
[workspace]
resolver = "3"
members = ["crates/sim", "crates/app"]

# Settings that member crates opt into with `edition.workspace = true` etc.,
# so they're declared once instead of copied into every crate.
[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

# Bevy is slow when built unoptimised. Lightly optimise our own code (fast rebuilds,
# still debuggable) and fully optimise every dependency, which only builds once.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Release build for the browser: `trunk build --release` (see crates/app/index.html,
# which selects this profile). Optimised for download size rather than raw speed.
[profile.wasm-release]
inherits = "release"
opt-level = "s"      # Optimise for size; usually within a few % of "3" for speed.
lto = "fat"          # Link-time optimisation across all crates: removes unused code.
codegen-units = 1    # Slower to compile, but lets LTO see everything at once.
strip = "debuginfo"  # Debug info is most of a dev build's 142 MB.
# Measured (with wasm-opt and the trimmed Bevy features in crates/app/Cargo.toml):
# 25.6 MB .wasm, 7.5 MB gzipped. With Bevy's default features it was 37.6 / 11.0 MB.
